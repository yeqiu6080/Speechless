[tool.poetry]
name = "wuyu-bot"
version = "0.1.1"
description = "一个普通的nonebot实现"
authors = ["yeqiu6080 <yeqiu6080@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = {extras = ["aiohttp", "fastapi"], version = "^2.4.0"}
nonebot-adapter-onebot = "^2.4.5"
nonebot-plugin-alconna = "^0.52.3"
nonebot-plugin-session = "^0.3.2"
nonebot-plugin-status = "^0.9.0"
nonebot-plugin-emojimix = "^0.4.0"
nonebot-plugin-workscore = "^0.1.2"
nonebot-plugin-color = "^0.4.2"
nonebot-plugin-deer-pipe = "^0.3.4"
pyyaml = "^6.0.2"
nonebot-plugin-apscheduler = "^0.5.0"
nonebot-plugin-userinfo = "^0.2.6"
nonebot-plugin-htmlrender = "^0.4.0"
cookit = {extras = ["jinja", "loguru", "playwright", "pydantic"], version = "^0.8.1"}
psutil = "^6.1.0"
py-cpuinfo = "^9.0.0"
anyio = "^4.6.2.post1"
httpx = "^0.27.2"
jinja2 = "^3.1.4"
yarl = "^1.17.1"
build = "^1.2.2.post1"
twine = "^5.1.1"


[[tool.poetry.source]]
name = "ali"
url = "http://mirrors.aliyun.com/pypi/simple/"
priority = "primary"


[tool.nonebot]
adapters = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]
plugins = ["nonebot_plugin_emojimix", "nonebot_plugin_workscore", "nonebot_plugin_color", "nonebot_plugin_deer_pipe"]
plugin_dirs = ["core/func","data/plugins"]
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"



